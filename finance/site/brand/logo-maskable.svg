<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gahonsh Finance">
  <!-- Maskable icon: full-bleed background, the monogram is kept inside the
       central safe zone (the centre 80% circle) so any OS mask crop keeps it. -->
  <defs>
    <linearGradient id="gf-navy-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#gf-navy-m)"/>
  <text x="256" y="330" font-family="Inter, Arial, Helvetica, sans-serif" font-size="224"
        font-weight="800" letter-spacing="-4" fill="#FFFFFF" text-anchor="middle">GF</text>
</svg>
