<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gahonsh Finance — shared icon sprite.

  A single, framework-free symbol sheet for every portal. Icons are drawn on a
  24x24 grid with a 2px stroke and inherit `currentColor`, so a page controls
  size and colour with CSS (`width`/`height`/`color`). Reference an icon with:

    <svg class="gf-icon" aria-hidden="true"><use href="/finance/shared/icons.svg#gf-shield-check"></use></svg>

  Functional (icon-only) controls must carry an aria-label; purely decorative
  icons are hidden from assistive tech with aria-hidden="true".
-->
