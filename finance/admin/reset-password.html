<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gahonsh Finance - Reset password</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Reset your Gahonsh Finance password">
    <link rel="stylesheet" href="/finance/shared/fonts.css">
    <link rel="icon" type="image/svg+xml" href="/finance/site/brand/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-wrap { max-width: 420px; margin: 6vh auto; padding: 0 1rem; }
        .reset-card { background: var(--surface, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 12px; padding: 1.5rem; }
        .reset-card h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
        .reset-card .sub { color: var(--muted, #6b7280); font-size: .92rem; margin: 0 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; margin-bottom: .35rem; }
        .form-group input { width: 100%; padding: .6rem .7rem; border: 1px solid var(--border, #e5e7eb); border-radius: 8px; font-size: 1rem; }
        .hint { color: var(--muted, #6b7280); font-size: .82rem; margin-top: .35rem; }
        button[type=submit] { width: 100%; padding: .7rem; border: 0; border-radius: 8px; background: var(--brand, #2563eb); color: #fff; font-size: 1rem; cursor: pointer; }
        button[type=submit]:disabled { opacity: .6; cursor: default; }
        .link-row { margin-top: 1rem; font-size: .9rem; }
        .alert { padding: .6rem .75rem; border-radius: 8px; font-size: .9rem; margin-bottom: 1rem; }
        .alert--error { background: #fef2f2; color: #991b1b; }
        .alert--success { background: #ecfdf5; color: #065f46; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="reset-wrap">
        <div class="reset-card">
            <a class="brand" href="index.html" aria-label="Gahonsh Finance home" style="display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1rem;text-decoration:none;color:inherit;">
                <img src="/finance/site/brand/logo.svg" alt="" width="30" height="30">
                <span>Gahonsh Finance</span>
            </a>
            <h1>Reset your password</h1>

            <div class="alert alert--error" id="error" hidden role="alert"></div>
            <div class="alert alert--success" id="success" hidden role="status"></div>

            <!-- Step 1: request a code -->
            <form id="requestForm">
                <p class="sub">Enter your account e-mail and we will send you a 6-digit code.</p>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
                </div>
                <button type="submit" id="requestButton">Send reset code</button>
            </form>

            <!-- Step 2: verify the code -->
            <form id="verifyForm" hidden>
                <p class="sub" id="verifyIntro">Enter the 6-digit code we e-mailed you.</p>
                <div class="form-group">
                    <label for="code">Verification code</label>
                    <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required>
                    <div class="hint" id="devCodeHint"></div>
                </div>
                <button type="submit" id="verifyButton">Verify code</button>
            </form>

            <!-- Step 3: choose a new password -->
            <form id="confirmForm" hidden>
                <p class="sub">Choose a new password (at least 8 characters).</p>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" id="confirmButton">Set new password</button>
            </form>

            <p class="link-row"><a href="/finance/admin/index.html">Back to sign in</a></p>
        </div>
    </main>

    <script type="module">
        const $ = (id) => document.getElementById(id);
        let email = '';
        let resetToken = '';

        function clearAlerts() {
            $('error').hidden = true;
            $('error').textContent = '';
            $('success').hidden = true;
            $('success').textContent = '';
        }
        function showError(msg) { clearAlerts(); $('error').textContent = msg; $('error').hidden = false; }
        function showSuccess(msg) { clearAlerts(); $('success').textContent = msg; $('success').hidden = false; }

        async function post(url, body) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || 'Request failed');
            return d;
        }

        $('requestForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            clearAlerts();
            email = $('email').value.trim();
            if (!email) { showError('Enter your e-mail address'); return; }
            const btn = $('requestButton');
            btn.disabled = true; btn.textContent = 'Sending…';
            try {
                const d = await post('/api/auth/password-reset/request', { email });
                // The API answers the same way whether or not the account
                // exists, so do not reveal which case it was.
                showSuccess('If that e-mail is registered, a reset code is on its way.');
                // A local mock deployment cannot actually deliver mail, so the
                // API echoes the code for development. It is null on any real
                // deployment (never shown to a customer).
                if (d.dev_code) {
                    $('devCodeHint').textContent = 'Development code: ' + d.dev_code;
                }
                $('requestForm').hidden = true;
                $('verifyForm').hidden = false;
                $('code').focus();
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Send reset code';
            }
        });

        $('verifyForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            clearAlerts();
            const code = $('code').value.trim();
            if (!/^\d{6}$/.test(code)) { showError('Enter the 6-digit code'); return; }
            const btn = $('verifyButton');
            btn.disabled = true; btn.textContent = 'Verifying…';
            try {
                const d = await post('/api/auth/password-reset/verify', { email, code });
                resetToken = d.reset_token;
                showSuccess('Code verified. Choose a new password.');
                $('verifyForm').hidden = true;
                $('confirmForm').hidden = false;
                $('newPassword').focus();
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Verify code';
            }
        });

        $('confirmForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            clearAlerts();
            const pw = $('newPassword').value;
            const confirm = $('confirmPassword').value;
            if (pw.length < 8) { showError('Use at least 8 characters'); return; }
            if (pw !== confirm) { showError('The two passwords do not match'); return; }
            const btn = $('confirmButton');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await post('/api/auth/password-reset/confirm', { token: resetToken, password: pw });
                $('confirmForm').hidden = true;
                showSuccess('Your password has been reset. You can now sign in.');
                setTimeout(() => { window.location.href = '/finance/admin/index.html'; }, 1500);
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Set new password';
            }
        });
    </script>
</body>
</html>
