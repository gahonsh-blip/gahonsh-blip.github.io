<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loans - Admin</title>
    <link rel="stylesheet" href="/finance/shared/fonts.css">
    <link rel="icon" type="image/svg+xml" href="/finance/site/brand/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/finance/site/brand/favicon-32.png">
    <link rel="icon" href="/finance/site/brand/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/finance/site/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container" hidden>
        <aside class="sidebar" id="sidebar">
            <a class="sidebar-header" href="index.html" aria-label="Gahonsh Finance home">
                <img src="/finance/site/brand/logo.svg" alt="" width="30" height="30">
                <span data-gf="text" data-gf-field="brandName">Gahonsh Finance</span>
            </a>
            <nav class="sidebar-nav">
                <a href="index.html" data-i18n="dashboard">Dashboard / Settings</a>
                <a href="customers.html" data-i18n="customers">Customers</a>
                <a href="loan-products.html">Loan Products</a>
                <a href="applications.html">Applications</a>
                <a href="loans.html" class="active" data-i18n="loans">Loans</a>
            </nav>
            <div class="mt-4">
                <button class="btn-secondary w-100" onclick="logout()" data-i18n="sign_out">Sign Out</button>
            </div>
            <div class="mt-4">
                <label for="themeSelect">Theme</label>
                <select id="themeSelect" onchange="setTheme(this.value)">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1 data-i18n="loans">Loans</h1>
                <div id="identity" class="badge"></div>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Loan Number</th>
                                <th>Principal (₹)</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rows">
                            <tr><td colspan="4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/components.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/i18n.js"></script>
    <script src="/finance/shared/session.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/loan-account.js"></script>
    <script>
        function getStatusBadge(status) {
            switch(status) {
                case 'ACTIVE': return 'badge-success';
                case 'CLOSED': return 'badge-success';
                case 'OVERDUE': return 'badge-danger';
                default: return 'badge-warning';
            }
        }

        async function load() {
            try {
                const r = await fetch('/api/loans', { headers: headers() });
                const d = await r.json();

                if (!r.ok) throw new Error(apiErrorMessage(d, 'Failed to load loans'));

                const rows = document.getElementById('rows');
                if (d.length === 0) {
                    rows.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--color-text-muted);">No loans found</td></tr>';
                    return;
                }

                rows.innerHTML = d.map(l => `
                    <tr>
                        <td><strong>${escapeHtml(l.loan_number)}</strong></td>
                        <td>₹${Number(l.principal_amount) || 0}</td>
                        <td><span class="badge ${getStatusBadge(l.status)}">${escapeHtml(l.status)}</span></td>
                        <td>
                            <button class="btn-secondary" data-loan-id="${escapeHtml(l.id)}" data-loan-action="view">View Details</button>
                            ${l.status === 'APPROVED' ? `<button class="btn-secondary" data-loan-id="${escapeHtml(l.id)}" data-loan-action="DISBURSED">Demo Disburse</button>` : ''}
                            ${l.status === 'DISBURSED' ? `<button data-loan-id="${escapeHtml(l.id)}" data-loan-action="ACTIVE">Activate</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function changeStatus(id, status) {
            try {
                const r = await fetch(`/api/loans/${id}/status`, {
                    method: 'PUT',
                    headers: headers(),
                    body: JSON.stringify({ status })
                });

                if (!r.ok) {
                    const errData = await r.json().catch(() => ({}));
                    throw new Error(apiErrorMessage(errData, 'Failed to update loan status'));
                }
                showToast(`Loan marked as ${status}`, 'success');
                load();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Delegated: the loan id from the API never enters an inline handler.
        document.addEventListener('click', (e) => {
            const btn = e.target.closest && e.target.closest('[data-loan-id]');
            if (!btn) return;
            const id = btn.dataset.loanId;
            if (btn.dataset.loanAction === 'view') window.openLoanDetails(id);
            else changeStatus(id, btn.dataset.loanAction);
        });

        document.addEventListener('DOMContentLoaded', load);
    </script>
    <script type="module" src="/finance/site/js/platform-config.js"></script>
</body>
</html>
