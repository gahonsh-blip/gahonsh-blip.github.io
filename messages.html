<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract messages · GAHONSH Freelancing</title>
<meta name="description" content="Private contract messages between a client and a freelancer on the GAHONSH Freelancing marketplace.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
:root{--bg:#0b1117;--card:#12181f;--line:#26333f;--ink:#e6edf3;--mut:#9fb0bf;--teal:#12776A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.05rem;margin:0}
a.back{color:#7fd1c4;text-decoration:none;font-size:.9rem}
main{max-width:760px;margin:0 auto;padding:18px}
#thread{display:flex;flex-direction:column;gap:10px;min-height:200px;margin-bottom:16px}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.msg.mine{margin-left:auto;background:#0f2b28;border-color:#1c4c46}
.msg .meta{font-size:.72rem;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);text-align:center;padding:30px 0}
form{display:flex;gap:8px}
textarea{flex:1;background:#0b1117;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;resize:vertical;min-height:54px}
button{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:700;cursor:pointer;min-height:48px}
button:disabled{opacity:.6;cursor:not-allowed}
@media(max-width:520px){.msg{max-width:92%}}

/* Follow the site theme so portal members in light mode do not get a dark
   page. The class is set before paint by the script below. */
body.light-mode{--bg:#f5f8fa;--card:#ffffff;--line:rgba(15,23,42,.12);--ink:#0f172a;--mut:#475569;--teal:#0f766e}
body.light-mode header{background:#ffffff}
body.light-mode a.back{color:#0f766e}
body.light-mode .msg.mine{background:#e6f6f3;border-color:#b7e3da}
body.light-mode textarea{background:#ffffff;color:#0f172a}
</style>
</head>
<body>
<header>
  <h1>Contract messages</h1>
  <a class="back" href="marketplace-dashboard.html">Back to dashboard</a>
</header>
<main>
  <div id="thread" aria-live="polite" aria-busy="true"><div class="empty">Loading…</div></div>
  <form id="sendForm">
    <textarea id="bodyInput" maxlength="2000" placeholder="Write a message…" aria-label="Message" required></textarea>
    <button type="submit" id="sendBtn">Send</button>
  </form>
</main>
<script>
  try {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
  } catch (e) { /* storage blocked */ }
</script>
<script src="supabase-config.js?v=8"></script>
<script src="marketplace-local.js?v=11"></script>
<script src="supabase-client.js?v=11"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var contractId = params.get('contract') || '';
  var thread = document.getElementById('thread');
  var form = document.getElementById('sendForm');
  var box = document.getElementById('bodyInput');
  var btn = document.getElementById('sendBtn');
  var me = null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Built with DOM calls, not innerHTML: the copy is static and the optional
  // link is a real anchor, so nothing user-supplied is parsed as markup.
  function showMessage(text, link){
    thread.textContent = '';
    thread.setAttribute('aria-busy', 'false');
    var wrap = document.createElement('div');
    wrap.className = 'empty';
    wrap.appendChild(document.createTextNode(text + ' '));
    if (link){
      var a = document.createElement('a');
      a.className = 'back';
      a.href = link.href;
      a.textContent = link.label;
      wrap.appendChild(a);
    }
    thread.appendChild(wrap);
    form.style.display = link || text.indexOf('No messages') === 0 ? '' : 'none';
  }

  function render(rows){
    if (!rows.length){
      showMessage('No messages yet. Say hello and share your requirements.');
      return;
    }
    thread.innerHTML = rows.map(function(m){
      var mine = m.sender_id === me;
      return '<div class="msg ' + (mine ? 'mine' : '') + '">' + esc(m.body) +
        '<div class="meta">' + (mine ? 'You' : 'Them') + ' · ' + new Date(m.created_at).toLocaleString() + '</div></div>';
    }).join('');
    thread.setAttribute('aria-busy', 'false');
    window.scrollTo(0, document.body.scrollHeight);
  }

  async function load(){
    if (!window.isMarketplaceReady || !window.isMarketplaceReady()){
      showMessage('The marketplace is still starting up. Please try again in a moment.');
      return;
    }
    var user = await window.GahonshDB.Auth.getCurrentUser();
    me = user && user.id;
    if (!me){
      showMessage('Please sign in to read your messages.', { href: 'marketplace-dashboard.html', label: 'Open the portal' });
      return;
    }
    try {
      render(await window.GahonshDB.Messages.list(contractId));
    } catch (err) {
      showMessage(err && err.message ? err.message : 'Could not load this conversation.');
    }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = (box.value || '').trim();
    if (!text) return;
    btn.disabled = true;
    try {
      await window.GahonshDB.Messages.send(contractId, text);
      box.value = '';
      await load();
    } catch (err) {
      alert('Could not send: ' + (err && err.message ? err.message : 'please try again.'));
    } finally {
      btn.disabled = false;
    }
  });

  if (!contractId){
    showMessage('Open this page from a contract card in your dashboard to read that conversation.',
      { href: 'marketplace-dashboard.html', label: 'Go to the portal' });
  } else {
    load();
  }
})();
</script>
</body>
</html>
