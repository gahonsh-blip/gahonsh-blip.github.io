name: Daily Short

# Renders one vertical Short every morning at 08:00 IST and publishes it to
# GitHub Pages, where social/daily.json is the manifest the Google Apps Script
# reads at 08:30 IST. Free: Pillow and ffmpeg on the runner, voice via edge-tts.
#
# If the render fails, nothing is published and the Apps Script keeps uploading
# from the pre-rendered pool (social/videos.json), so YouTube is never empty.

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          test -x "$(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -1

      - name: Install renderer dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          pip install -q pillow edge-tts
          python -c "import PIL, edge_tts; print('pillow', PIL.__version__)"

      - name: Render today's Short
        run: |
          set -euo pipefail
          python3 social/render.py --root .
          test -s social/daily.json
          python3 -c "import json,pathlib,sys; m=json.load(open('social/daily.json')); p=pathlib.Path('social/media')/pathlib.Path(m['video_url']).name; print(m['date'], m['bytes'], 'bytes', p); sys.exit(0 if p.exists() and p.stat().st_size>20000 else 1)"

      - name: Publish to GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "GAHONSH autopilot"
          git config user.email "gahonsh@gmail.com"
          git add social/media social/daily.json
          if git diff --staged --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "short: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git push
          fi
