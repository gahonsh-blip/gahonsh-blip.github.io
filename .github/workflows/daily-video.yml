name: Daily Short

# Renders one vertical Short every morning at 08:00 IST and publishes it to
# GitHub Pages, where social/daily.json is already the manifest the Google Apps
# Script reads at 08:30 IST. Free: Pillow and ffmpeg ship on the runner, and the
# voice uses edge-tts. No API key, no card, no phone.
#
# If the render fails, nothing is published and the Apps Script keeps uploading
# from the pre-rendered pool (social/videos.json), so YouTube is never empty.

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow edge-tts
          ffmpeg -version | head -1

      - name: Render today's Short
        run: |
          python3 social/render.py --root .
          test -s social/daily.json
          python3 - <<'PY'
          import json, pathlib
          m = json.load(open('social/daily.json'))
          p = pathlib.Path('social/media') / pathlib.Path(m['video_url']).name
          print(m['date'], m['bytes'], 'bytes', p)
          assert p.exists() and p.stat().st_size > 20000, 'render too small'
          PY

      - name: Publish to GitHub Pages
        run: |
          git config user.name "GAHONSH autopilot"
          git config user.email "gahonsh@gmail.com"
          git add social/media social/daily.json
          if git diff --staged --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "short: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git push
          fi
